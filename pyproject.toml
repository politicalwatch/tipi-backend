[project]
name = "qhld-backend"
version = "1.2.0"
description = "QHLD Backend"
authors = [{ name = "pr3ssh" }]
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.138.0",
    "uvicorn[standard]==0.49.0",
    "slowapi==0.1.10",
    # redis-py is capped at <6.5 by qhld-tasks' celery 5.6.3 / kombu[redis]
    "redis==6.4.0",
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "natsort==8.4.0",
    "pdfminer.six==20260107",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "qhld-data",
    "qhld-tasks",
]

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx2==2.4.0",
    "locust==2.44.3",
]

[tool.uv.sources]
qhld-data  = { git = "https://github.com/politicalwatch/qhld-data.git", tag = "v1.3.0" }
qhld-tasks = { git = "https://github.com/politicalwatch/qhld-tasks.git", tag = "v1.1.0" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tipi_backend"]
