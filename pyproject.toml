[project]
name = "qhld-backend"
version = "1.0.0"
description = "QHLD Backend"
authors = [{ name = "pr3ssh" }]
requires-python = ">=3.12"

dependencies = [
    "Flask==3.1.1",
    "Flask-Caching==2.3.0",
    "Flask-Compress==1.17.0",
    "Flask-Cors==6.0.0",
    "Flask-Limiter==3.8.0",
    "flask-restx==1.3.0",
    "gunicorn==23.0.0",
    "natsort==8.4.0",
    "pdfminer.six==20240706",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "python-slugify==8.0.4",
    "regex==2024.11.6",
    "six==1.16.0",
    "Werkzeug==3.1.5",
    "qhld-data",
    "qhld-tasks",
]

[dependency-groups]
dev = [
    "ipdb==0.13.13",
    "parameterized==0.9.0",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "locust==2.25.0",
]

[tool.uv.sources]
qhld-data  = { git = "https://github.com/politicalwatch/qhld-data.git" }
qhld-tasks = { git = "https://github.com/politicalwatch/qhld-tasks.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tipi_backend"]
